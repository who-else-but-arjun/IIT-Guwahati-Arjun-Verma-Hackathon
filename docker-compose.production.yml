# Production stack for the Oracle VM. The frontend is deployed separately to
# Cloudflare Pages; only Caddy publishes ports to the public internet.
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: src/backend/Dockerfile
  image: crisil-financial-nlp-backend:production
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: financial_nlp
    volumes:
      - mongo_data:/data/db
      # On first boot only, restore the checked-in data snapshot.
      - ./data/seed/financial_nlp.archive.gz:/seed/financial_nlp.archive.gz:ro
      - ./data/seed/10-restore-financial-nlp.sh:/docker-entrypoint-initdb.d/10-restore-financial-nlp.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 5

  trading:
    <<: *backend-image
    command: ["gunicorn", "app.wsgi:application", "--bind", "0.0.0.0:8001", "--workers", "1", "--threads", "4"]
    environment:
      DJANGO_SETTINGS_MODULE: app.trading.config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the server .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in the server .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in the server .env}
      DJANGO_DEBUG: "0"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/trading/health/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s

  backend:
    <<: *backend-image
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "1", "--threads", "8", "--timeout", "90"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the server .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in the server .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in the server .env}
      DJANGO_DEBUG: "0"
      KAGGLEHUB_CACHE: /models
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      NLP_TRADING_SOCKET_HOST: trading
      NLP_TRADING_SOCKET_PORT: 8765
    volumes:
      - model_store:/models
    depends_on:
      mongo:
        condition: service_healthy
      trading:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=8)"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 90s

  alpaca-news:
    <<: *backend-image
    command: ["python", "-m", "services.connectors.retriever", "listen"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      NEWS_ANALYSIS_WORKER: "false"
      KAGGLEHUB_CACHE: /models
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      NLP_TRADING_SOCKET_HOST: trading
      NLP_TRADING_SOCKET_PORT: 8765
    volumes:
      - model_store:/models
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading:
        condition: service_healthy

  bluesky-news:
    <<: *backend-image
    command: ["python", "-m", "services.connectors.retriever", "bluesky"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      NEWS_ANALYSIS_WORKER: "false"
      KAGGLEHUB_CACHE: /models
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      NLP_TRADING_SOCKET_HOST: trading
      NLP_TRADING_SOCKET_PORT: 8765
    volumes:
      - model_store:/models
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading:
        condition: service_healthy

  finnhub-poller:
    <<: *backend-image
    command: ["python", "-m", "services.connectors.retriever", "poll-news", "--interval-seconds", "900", "--lookback-days", "1"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      NEWS_ANALYSIS_WORKER: "false"
      KAGGLEHUB_CACHE: /models
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      NLP_TRADING_SOCKET_HOST: trading
      NLP_TRADING_SOCKET_PORT: 8765
    volumes:
      - model_store:/models
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading:
        condition: service_healthy

  news-analysis-worker:
    <<: *backend-image
    command: ["python", "-m", "services.connectors.retriever", "analyze", "--idle-seconds", "3"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      KAGGLEHUB_CACHE: /models
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: financial_nlp
      REDIS_URL: redis://redis:6379/0
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      NLP_TRADING_SOCKET_HOST: trading
      NLP_TRADING_SOCKET_PORT: 8765
    volumes:
      - model_store:/models
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOSTNAME: ${API_HOSTNAME:?Set API_HOSTNAME in the server .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      trading:
        condition: service_healthy

volumes:
  redis_data:
  mongo_data:
  model_store:
  caddy_data:
  caddy_config:
